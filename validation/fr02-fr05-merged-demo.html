<!DOCTYPE html>
<!--
  FR-02 + FR-05 合并演示（验证件，不计入需求文档）
  -----------------------------------------------------------------
  内容：自选列表（11 列 / 横滑 / 名称列冻结 / 指数条随分组 / 推送高亮）
        + 搜索页（六级匹配 / 分段结果 / 命中高亮 / 就地加自选）
        两者共享同一份自定义 Mock 数据与自选仓储。
  说明：本页不做自动校验，不列验收项，仅供交互试玩。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自选 + 搜索 · FR-02 / FR-05 合并演示</title>
<style>
  :root{
    --brand:#E84026; --brand-soft:rgba(232,64,38,.10);
    --up:#E84026; --down:#0A9E5C; --flat:#6B6B70;
    --canvas:#E9EBEF; --surface:#FFFFFF;
    --text-1:#181818; --text-2:#8A8A8E; --text-3:#B0B0B6;
    --line:#F1F1F3; --line-strong:#E4E6EA;
    --tag-fin-bg:#F3EEFF; --tag-fin-fg:#6F45E0;
    --tag-star-bg:#FFF3E2; --tag-star-fg:#C9791A;
    --tag-stop-bg:#F2F3F5; --tag-stop-fg:#6B6B70;
    --r-pill:999px;
    --font-family:"HarmonyOS Sans SC","HarmonyOS Sans","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#EDF0F4;color:var(--text-1);font-family:var(--font-family);font-size:14px}
  button{font:inherit;color:inherit;cursor:pointer}

  /* 顶栏 */
  .topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;
    border-bottom:1px solid #E3E6EB}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .brand small{font-weight:400;color:#8A8A8E;font-size:12px;margin-left:6px}
  .badge{font-size:11px;color:#8A5A00;background:#FFF7E6;border:1px solid #F5E3BE;border-radius:6px;padding:2px 7px}
  .tgroup{display:flex;gap:5px;align-items:center;margin-left:auto}
  .tgroup .lbl{font-size:10px;color:#A6ACB4;letter-spacing:.04em}
  .sbtn{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;color:#3A3A3E}
  .sbtn:hover{background:#F6F7F9}
  .sbtn.on{background:var(--brand-soft);border-color:#F3B3A8;color:#C6341C;font-weight:600}

  .stage{height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;
    background:radial-gradient(120% 120% at 50% 0%,#F6F8FB 0%,#E3E7ED 100%)}
  .device{background:#0E0F12;border-radius:40px;padding:10px;
    box-shadow:0 26px 70px rgba(16,24,40,.24),0 0 0 1px rgba(255,255,255,.35) inset;
    transition:width .22s ease,height .22s ease}
  .screen{position:relative;width:100%;height:100%;background:#fff;border-radius:34px;overflow:hidden;
    display:flex;flex-direction:column}

  .statusbar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    font-size:11px;font-weight:600;flex:0 0 auto}
  .titlebar{padding:4px 16px 6px;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:0 0 auto}

  /* 指数条 */
  .indexrow{display:flex;gap:10px;padding:0 16px 10px;flex:0 0 auto;align-items:stretch}
  .indexbar{display:flex;gap:10px;overflow-x:auto;flex:1;min-width:0}
  .indexbar::-webkit-scrollbar{display:none}
  .idx{min-width:70px;flex:0 0 auto}
  .idx .n{font-size:11px;color:var(--text-2);white-space:nowrap}
  .idx .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
  .idx .d{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .promo{flex:0 0 92px;padding:5px 9px;border-radius:10px;display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(160deg,#FFF1EF,#FFE7E3)}
  .promo .t{font-size:12px;font-weight:650;color:#C6341C;white-space:nowrap}
  .promo .s{font-size:10px;color:#C6341C;opacity:.85;line-height:1.35;margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)} .dim{color:var(--text-3)}

  /* 分组栏 */
  .groupbar{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .tabs{display:flex;gap:14px;overflow-x:auto;flex:1;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .gtab{font-size:15px;color:#5A5A60;padding:7px 0 9px;position:relative;cursor:pointer;white-space:nowrap}
  .gtab.on{color:var(--brand);font-weight:650}
  .gtab.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:20px;height:3px;border-radius:2px;background:var(--brand)}
  .gtab .n{font-size:11px;color:#B0B0B6;margin-left:2px}

  /* 11 列表格 */
  .table-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .table-fade{position:absolute;top:0;right:0;width:22px;height:100%;pointer-events:none;z-index:7;
    background:linear-gradient(to right,rgba(255,255,255,0),#fff 88%)}
  .table-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;position:relative}
  .table-scroll::-webkit-scrollbar{height:6px;width:6px}
  .table-scroll::-webkit-scrollbar-thumb{background:#D8DBE0;border-radius:3px}
  .cols{grid-template-columns:minmax(calc(112px * var(--fs-scale)),1fr) calc(76px * var(--fs-scale)) calc(70px * var(--fs-scale))
    calc(78px * var(--fs-scale)) calc(82px * var(--fs-scale)) calc(68px * var(--fs-scale)) calc(78px * var(--fs-scale))
    calc(66px * var(--fs-scale)) calc(66px * var(--fs-scale)) calc(70px * var(--fs-scale)) calc(68px * var(--fs-scale))}
  .thead,.row{display:grid;align-items:center;width:max-content;min-width:100%;padding:8px 12px 8px 0}
  .thead{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
    font-size:11px;color:var(--text-2);padding-top:6px;padding-bottom:6px}
  .thead .h{text-align:right;white-space:nowrap;user-select:none;cursor:pointer;padding-left:8px}
  .thead .h:first-child{text-align:left;cursor:default;padding-left:16px;position:sticky;left:0;z-index:8;background:#fff}
  .thead .h.sorted{color:var(--brand);font-weight:600}
  .row{border-bottom:1px solid #F7F7F9;cursor:pointer;background:#fff;transition:background .15s}
  .row:hover{background:#FAFAFB}
  .row.flash{animation:flashRow 1s ease-out}
  @keyframes flashRow{0%{background:#FCE7E2}55%{background:#FDF3F0}100%{background:#fff}}
  .namecell{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:16px;position:sticky;left:0;z-index:2;
    background:#fff;align-self:stretch;justify-content:center}
  .row:hover .namecell{background:#FAFAFB}
  .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;align-items:center;gap:4px;font-size:11px;color:#A0A0A6;font-variant-numeric:tabular-nums}
  .tag{font-size:9px;line-height:14px;padding:0 4px;border-radius:3px;font-weight:500}
  .tag.fin{background:var(--tag-fin-bg);color:var(--tag-fin-fg)}
  .tag.star{background:var(--tag-star-bg);color:var(--tag-star-fg)}
  .tag.stop{background:var(--tag-stop-bg);color:var(--tag-stop-fg)}
  .tag.new{background:#FFF3DB;color:#A96400}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px;font-size:13px;color:#4A4A50}
  .num.price,.num.pct{font-size:15px;font-weight:500}
  .num.chg{font-size:14px;font-weight:500}
  .row.is-suspended{opacity:.55}

  /* 底部 */
  .addwrap{flex:0 0 auto;padding:10px 16px 8px;display:flex;justify-content:center}
  .btn-add{width:72%;max-width:280px;height:38px;border-radius:var(--r-pill);border:1px solid #ECECEF;background:#fff;
    color:var(--text-3);font-size:14px}
  .btn-add:hover{border-color:#E0E2E7;color:var(--text-2)}
  .tabbar{flex:0 0 auto;height:58px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#8A8A8E;background:none;border:0}
  .tab.on{color:var(--brand);font-weight:650}

  .state{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:36px 28px;text-align:center;gap:6px}
  .state.show{display:flex}
  .state .art{width:62px;height:62px;border-radius:18px;background:#F4F5F7;margin-bottom:8px}
  .state .t{font-size:15px;font-weight:600}
  .state .d{font-size:12px;color:var(--text-2)}
  .state .b{margin-top:14px;padding:8px 18px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff}

  .offline{display:none;align-items:center;gap:6px;padding:6px 16px;background:#FFF7E6;color:#A96400;font-size:11px;flex:0 0 auto}
  .offline.show{display:flex}
  /* ===== C10 断线：冻结 + 置灰 + 顶部条 ===== */
  .offline.strong{background:#FFF1EF;color:#C6341C}
  .conn-offline .row, .conn-offline .card{opacity:.55}

  /* ===== CC-6 字号缩放：列宽与字号同比例放大 ===== */
  .screen{--fs-scale:1}
  .row .nm{font-size:calc(15px * var(--fs-scale))}
  .row .meta{font-size:calc(11px * var(--fs-scale))}
  .row .num.price,.row .num.pct{font-size:calc(15px * var(--fs-scale))}
  .row .num.chg{font-size:calc(14px * var(--fs-scale))}
  .row .num.vol,.row .num.amt,.row .num.last,.row .num.amp,.row .num.turn,.row .num.pe,.row .num.pb{font-size:calc(13px * var(--fs-scale))}
  .thead{font-size:calc(11px * var(--fs-scale))}

  /* 搜索页 */
  .searchpage{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:20}
  .searchpage.show{display:flex;animation:spIn .16s ease-out}
  @keyframes spIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .searchpage.show{animation:none} }
  .shead{display:flex;align-items:center;gap:6px;padding:6px 10px 8px;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .sback{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;font-size:18px}
  .sback:hover{background:#F4F5F7}
  .sbox{position:relative;flex:1;min-width:0}
  .sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#A9ACB4}
  .sbox input{width:100%;height:34px;border-radius:var(--r-pill);border:1px solid #ECECEF;background:#F6F7F9;
    padding:0 30px 0 30px;font-size:13px;outline:none}
  .sbox input:focus{border-color:#F3B3A8;background:#fff}
  .sclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
    border:0;background:#E1E3E8;color:#fff;font-size:10px;line-height:1;display:none}
  .sclear.show{display:block}
  .scancel{border:0;background:none;font-size:13px;color:#4A4A50;padding:4px 6px;flex:0 0 auto}

  .sbody{flex:1;min-height:0;overflow:auto}
  .sbody::-webkit-scrollbar{width:0}
  .init{padding:14px 16px 20px}
  .init h4{margin:0 0 10px;font-size:12px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:8px}
  .init h4 .clr{margin-left:auto;font-size:11px;color:var(--text-3);background:none;border:0;font-weight:400}
  .hist{display:flex;flex-wrap:wrap;gap:8px}
  .hchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:var(--r-pill);
    background:#F6F7F9;border:1px solid #EFEFF2;color:#3A3A3E}
  .hchip button{border:0;background:none;color:#B0B0B6;font-size:11px;padding:0;line-height:1}
  .emptyhint{font-size:12px;color:var(--text-3);line-height:1.7}
  .hot{margin-top:16px}
  .hotrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F7F7F9;cursor:pointer}
  .hotrow:hover{background:#FAFAFB}
  .hotrank{width:18px;font-size:12px;font-weight:700;color:#B0B0B6;font-variant-numeric:tabular-nums}
  .hotrank.top{color:var(--brand)}
  .hotname{flex:1;font-size:13px}
  .hottag{font-size:10px;padding:1px 5px;border-radius:3px;background:#F4F5F7;color:#8A8A8E}
  .suggest{margin-top:16px;font-size:11px;color:var(--text-3);line-height:1.9}
  .suggest code{background:#F4F5F7;border-radius:4px;padding:1px 5px;color:#5A5A60}

  .bkt{padding-top:2px}
  .bkth{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;gap:6px;
    padding:8px 16px;font-size:11px;color:var(--text-2);border-bottom:1px solid var(--line)}
  .bkth b{font-weight:600;color:var(--text-1);font-size:12px}
  .bkth .cnt{color:var(--text-3);font-variant-numeric:tabular-nums}
  .rrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #F7F7F9;cursor:pointer;background:#fff}
  .rrow:hover{background:#FAFAFB}
  .rmain{flex:1;min-width:0}
  .rname{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:#A0A0A6;font-variant-numeric:tabular-nums}
  .rnum{text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:70px}
  .rnum .p{font-size:14px;font-weight:500}
  .rnum .c{font-size:11px;font-weight:600}
  mark{background:#FFE7A8;color:inherit;padding:0 1px;border-radius:2px}
  .radd{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid #E6E8EC;background:#fff;
    color:#8A8A8E;font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
  .radd:hover{border-color:#F3B3A8;color:var(--brand)}
  .radded{flex:0 0 auto;font-size:11px;color:var(--text-3);width:40px;text-align:center}
  .more{display:block;width:100%;padding:11px;text-align:center;font-size:12px;color:var(--brand);
    background:#fff;border:0;border-bottom:1px solid #F7F7F9}
  .more:hover{background:#FFF9F7}
  .skrow{height:52px;margin:0 16px;border-bottom:1px solid #F7F7F9;border-radius:6px;
    background:linear-gradient(90deg,#F5F6F8 25%,#EAECEF 37%,#F5F6F8 63%);background-size:400% 100%;
    animation:shimmer 1.3s infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .nores{padding:46px 28px;text-align:center}
  .nores .t{font-size:15px;font-weight:600;margin-bottom:4px}
  .nores .d{font-size:12px;color:var(--text-2);margin-bottom:14px}
  .nores .b{padding:7px 16px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff;font-size:13px}

  .toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,8px);background:rgba(20,20,22,.92);
    color:#fff;font-size:12px;padding:8px 14px;border-radius:var(--r-pill);opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;max-width:82%;text-align:center;z-index:60;line-height:1.4}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  #jsErr{position:fixed;left:0;bottom:0;z-index:9999;font:12px ui-monospace,monospace;color:#fff;background:#C00;padding:4px 8px;display:none}
</style>
</head>
<body>
<div id="jsErr"></div>

<div class="topbar">
  <div class="brand">自选 + 搜索<small>FR-02 / FR-05 合并演示</small></div>
  <span class="badge">验证件 · 不计入文档</span>
  <div class="tgroup">
    <span class="lbl">宽度</span>
    <button class="sbtn on" data-width="sm">sm</button>
    <button class="sbtn" data-width="md">md</button>
    <button class="sbtn" data-width="lg">lg</button>
    <button class="sbtn" data-width="xl">xl</button>
  </div>
  <div class="tgroup">
    <span class="lbl">场景</span>
    <button class="sbtn on" id="btnPush">推送刷新</button>
    <button class="sbtn" id="btnConn">连接：在线</button>
    <button class="sbtn" id="btnFs">字号 1.0×</button>
    <button class="sbtn" id="btnEmpty">清空自选</button>
    <button class="sbtn" id="btnReset">重置</button>
  </div>
  <div class="tgroup">
    <button class="sbtn" id="btnSearch">打开搜索</button>
  </div>
</div>

<div class="stage">
  <div class="device" id="device" style="width:375px;height:790px">
    <div class="screen" id="screen" data-width="sm">

      <div class="statusbar"><span>09:41</span><span style="display:flex;gap:8px"><span>5G</span><span>86%</span></span></div>
      <div class="titlebar">自选股</div>

      <div class="indexrow">
        <div class="indexbar" id="indexbar"></div>
        <div class="promo"><div class="t">券某某股 ›</div><div class="s">本期这些股票最被看好</div></div>
      </div>

      <div class="offline" id="offlineBar">⚠︎ 行情连接中… 数据可能延迟</div>

      <div class="groupbar">
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="table-wrap" id="tableWrap">
        <div class="table-scroll" id="tableScroll">
          <div class="thead cols" id="thead">
            <div class="h">股票名称</div>
            <div class="h" data-key="price">最新价</div>
            <div class="h" data-key="chg">涨跌</div>
            <div class="h" data-key="pct">涨跌幅</div>
            <div class="h" data-key="vol">总量</div>
            <div class="h" data-key="last">现量</div>
            <div class="h" data-key="amt">成交额</div>
            <div class="h" data-key="amp">振幅</div>
            <div class="h" data-key="turn">换手</div>
            <div class="h" data-key="pe">市盈率</div>
            <div class="h" data-key="pb">市净率</div>
          </div>
          <div id="rows"></div>
        </div>
        <div class="table-fade" aria-hidden="true"></div>
      </div>

      <div class="addwrap" id="addwrap">
        <button class="btn-add" id="addBtn">添加自选</button>
      </div>

      <div class="state" id="empty">
        <div class="art"></div>
        <div class="t">还没有自选股</div>
        <div class="d">搜索股票，加入你的自选</div>
        <button class="b" id="emptyAdd">搜索添加</button>
      </div>

      <div class="tabbar">
        <button class="tab">首页</button>
        <button class="tab">最新资讯</button>
        <button class="tab on">自选</button>
        <button class="tab">行情</button>
      </div>

      <!-- 搜索页 -->
      <div class="searchpage" id="searchPage">
        <div class="shead">
          <button class="sback" id="sBack" aria-label="返回">‹</button>
          <div class="sbox">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/>
            </svg>
            <input id="q" placeholder="代码 / 名称 / 拼音" autocomplete="off" />
            <button class="sclear" id="sClear" aria-label="清空">✕</button>
          </div>
          <button class="scancel" id="sCancel">取消</button>
        </div>
        <div class="sbody" id="sbody"></div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
window.addEventListener('error', function (e) {
  var d = document.getElementById('jsErr');
  d.style.display = 'block';
  d.textContent = 'JSERROR: ' + e.message;
});

(function () {
  'use strict';

  /* ================= 数据 ================= */
  var PYCHAR = {
    '某':'mou','科':'ke','技':'ji','地':'di','产':'chan','药':'yao','业':'ye','银':'yin','行':'hang',
    '重':'zhong','工':'gong','芯':'xin','片':'pian','汽':'qi','车':'che','电':'dian','力':'li',
    '传':'chuan','媒':'mei','环':'huan','保':'bao','材':'cai','料':'liao','光':'guang','软':'ruan',

    if (name.indexOf(term) > 0) return { tier:3, field:'name', start:name.indexOf(term), len:term.length };
    if (item.qpy.indexOf(t) === 0) return { tier:4, field:'qpy', start:0, len:t.length };

      var sc = $('tableScroll');
      sc.scrollTop = Math.max(0, el.offsetTop - 36);
      setTimeout(function () { el.classList.remove('flash'); }, 1200);
    }
    if (state.search.open) renderSearch();
    var g = groupsOf(s);
    var names = Object.keys(g).map(groupName).join('、');
    toast('已加入「' + s.name + '」· ' + names);
    if (state.tab !== 'all' && !g[state.tab]) {
      toast('已加入' + names + '，当前分组不显示');
    }
  }

  /* ================= 事件 ================= */
  function bind() {
    document.querySelectorAll('[data-width]').forEach(function (b) {
      b.onclick = function () {
        var w = b.getAttribute('data-width');
        state.width = w;
        var dim = { sm:[375,790], md:[700,860], lg:[1000,700], xl:[1180,740] }[w];
        $('device').style.width = dim[0] + 'px';
        $('device').style.height = dim[1] + 'px';
        $('screen').setAttribute('data-width', w);
        document.querySelectorAll('[data-width]').forEach(function (x) { x.classList.toggle('on', x === b); });
      };
    });

    $('btnPush').onclick = function () {
      state.push = !state.push;
      $('btnPush').classList.toggle('on', state.push);
    };
    $('btnConn').onclick = function () {
      var seq = ['online', 'weak', 'offline', 'delayed'];
      var label = { online:'在线', weak:'弱网', offline:'断线', delayed:'延迟' };
      state.conn = seq[(seq.indexOf(state.conn) + 1) % seq.length];
      state.offline = state.conn === 'offline';
      $('btnConn').textContent = '连接：' + label[state.conn];
      $('btnConn').classList.toggle('on', state.conn !== 'online');
      renderConn();
      $('btnPush').classList.toggle('on', state.push && state.conn !== 'offline');
    };
    $('btnFs').onclick = function () {
      var seq = [1, 1.3, 1.45];
      state.fs = seq[(seq.indexOf(state.fs) + 1) % seq.length];
      $('btnFs').textContent = '字号 ' + state.fs.toFixed(2).replace(/0$/, '') + '×';
      $('btnFs').classList.toggle('on', state.fs > 1);
      renderConn();
    };
    $('btnEmpty').onclick = function () { state.watch = {}; state.order = []; renderAll(); toast('已清空自选'); };
    $('btnReset').onclick = resetAll;
    $('btnSearch').onclick = openSearch;
    $('addBtn').onclick = openSearch;
    $('emptyAdd').onclick = openSearch;

    $('tabs').addEventListener('click', function (e) {
      var t = e.target.closest('[data-tab]');
      if (!t) return;
      state.tab = t.getAttribute('data-tab');
      renderAll();
    });

    $('thead').addEventListener('click', function (e) {
      var h = e.target.closest('[data-key]');
      if (!h) return;
      var k = h.getAttribute('data-key');
      if (state.sort !== k) { state.sort = k; state.sortDir = 1; }
      else if (state.sortDir === 1) state.sortDir = -1;
      else if (state.sortDir === -1) { state.sort = ''; state.sortDir = 0; }
      renderList();
    });

    $('rows').addEventListener('click', function (e) {
      var row = e.target.closest('[data-code]');
      if (!row) return;
      var s = byCode(row.getAttribute('data-code'));
      toast(s ? ('查看详情：' + s.name + '（FR-06 占位）') : '查看详情');
    });

    /* 搜索交互 */
    $('sBack').onclick = closeSearch;
    $('sCancel').onclick = closeSearch;
    $('q').addEventListener('input', function (e) {
      $('sClear').classList.toggle('show', !!e.target.value);
      scheduleSearch(e.target.value);
    });
    $('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var t = String($('q').value || '').trim();
        if (!t) return;
        clearTimeout(debounceTimer);
        state.search.term = t;
        pushHistory(t);
        doSearch(t);
      }
    });
    $('sClear').onclick = function () {
      $('q').value = ''; $('sClear').classList.remove('show');
      scheduleSearch('');
      $('q').focus();
    };

    $('sbody').addEventListener('click', function (e) {
      var add = e.target.closest('[data-add]');
      if (add) { e.stopPropagation(); addStock(add.getAttribute('data-add')); return; }
      if (e.target.id === 'moreBtn') { state.search.expanded = true; renderSearch(); return; }
      if (e.target.id === 'clearTerm') { $('q').value = ''; $('sClear').classList.remove('show'); scheduleSearch(''); return; }
      if (e.target.id === 'clrHist') { state.history = []; renderSearch(); return; }
      var del = e.target.closest('[data-delhist]');
      if (del) {
        e.stopPropagation();
        var t = del.getAttribute('data-delhist');
        state.history = state.history.filter(function (x) { return x !== t; });
        renderSearch();
        return;
      }
      var hist = e.target.closest('[data-hist]');
      if (hist) {
        var term = hist.getAttribute('data-hist');
        $('q').value = term; $('sClear').classList.add('show');
        state.search.term = term; doSearch(term);
        return;
      }
      var hot = e.target.closest('[data-hot]');
      if (hot) {
        var ht = hot.getAttribute('data-hot');
        $('q').value = ht; $('sClear').classList.add('show');
        state.search.term = ht;
        pushHistory(ht);
        doSearch(ht);
        return;
      }
      var row = e.target.closest('.rrow');
      if (row) {
        var s = byCode(row.getAttribute('data-code'));
        toast(s ? ('查看详情：' + s.name + '（FR-06 占位）') : '查看详情');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && state.search.open) closeSearch();
    });
  }

  function pushHistory(t) {
    if (!t) return;
    state.history = [t].concat(state.history.filter(function (x) { return x !== t; })).slice(0, 10);
  }

  function openSearch() {
    state.search.open = true;
    state.search.term = '';
    state.search.buckets = null;
    state.search.seq++;
    $('searchPage').classList.add('show');
    $('q').value = '';
    $('sClear').classList.remove('show');
    renderSearch();
    setTimeout(function () { try { $('q').focus(); } catch (e) {} }, 50);
  }
  function closeSearch() {
    state.search.open = false;
    state.search.seq++;
    $('searchPage').classList.remove('show');
    $('q').blur();
  }

  function resetAll() {
    state.watch = {};
    state.order = [];
    ['600519','600606','300089','600036','601766','688055','000666','600002']
      .forEach(function (c) { state.watch[c] = true; state.order.push(c); });
    state.tab = 'all'; state.sort = ''; state.sortDir = 0;
    state.push = true; state.offline = false;
    state.conn = 'online'; state.fs = 1;
    $('btnPush').classList.add('on');
    $('btnConn').textContent = '连接：在线';
    $('btnConn').classList.remove('on');
    $('btnFs').textContent = '字号 1.0×';
    $('btnFs').classList.remove('on');
    flashMap = {};
    renderConn();
    renderAll();
  }

  function boot() {
    resetAll();
    bind();
    pushTimer = setInterval(tick, 1600);
    var q = new URLSearchParams(location.search);
    var w = q.get('w');
    if (w && ['sm','md','lg','xl'].indexOf(w) >= 0) {
      var btn = document.querySelector('[data-width="' + w + '"]');
      if (btn) btn.click();
    }
    if (q.get('s') === 'offline') {
      state.conn = 'offline'; state.offline = true;
      $('btnConn').textContent = '连接：断线';
      $('btnConn').classList.add('on');
      renderConn();
    }
    if (q.get('q')) {
      openSearch();
      setTimeout(function () {
        $('q').value = q.get('q');
        $('sClear').classList.add('show');
        state.search.term = q.get('q');
        doSearch(q.get('q'));
      }, 120);
    }
  }

  boot();
})();
</script>
</body>
</html>
